name: Initialize from template

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Override app name (defaults to repo name)"
        required: false
        type: string
      display_name:
        description: "Override display name (defaults to title-cased app name)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Initial commit')) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Initialize template
        env:
          APP_NAME: ${{ github.event.inputs.app_name || github.event.repository.name }}
          DISPLAY_NAME: ${{ github.event.inputs.display_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--name "$APP_NAME")
          if [[ -n "$DISPLAY_NAME" ]]; then
            args+=(--display-name "$DISPLAY_NAME")
          fi
          node scripts/init-template.mjs "${args[@]}"

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: initialize from template"
            git push
          else
            echo "No changes to commit."
          fi
